local_backend: true

backend:
  name: github
  repo: ghozifidaul/personal-site
  branch: main
  auth_methods: [token]

media_folder: /public/images/blog
public_folder: /images/blog

site_url: https://ghozifidaul.com

collections:
  - name: blog
    label: Blog
    folder: /src/content/blog
    create: true
    slug: '{{slug}}'
    editor:
      preview: false
    summary: '{{title}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: date, label: Date, widget: datetime }
      - { name: tags, label: Tags, widget: list, required: false, default: [] }
      - { name: image, label: Cover Image, widget: image, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: experience
    label: Experience
    files:
      - name: entries
        label: Experience Entries
        file: /src/data/experience.json
        fields:
          - name: experiences
            label: Entries
            widget: list
            collapsed: true
            fields:
              - { name: title, label: Job Title, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: period, label: Period, widget: string }
              - { name: highlights, label: Highlights, widget: list }
              - { name: tags, label: Tags, widget: list }
